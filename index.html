<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Previsión de tesorería</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=JetBrains+Mono:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
#prevision{
  /* Layout: resumen arriba (como las celdas TOTAL/DIFERENCIA), debajo dos columnas Ventas | Compras como en la hoja */
  --pv-bg:#f6f7f8; --pv-card:#ffffff; --pv-fg:#1d2329; --pv-muted:#5f6b76; --pv-line:#dde2e7;
  --pv-accent:#2f5d7c; --pv-accent-soft:#e6eef4; --pv-pos:#1f7a4d; --pv-neg:#b3362b; --pv-warn:#9a6a00; --pv-warn-soft:#fbf1d9;
  --pv-head:"Archivo", "Segoe UI", system-ui, sans-serif;
  --pv-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --pv-num:"JetBrains Mono", ui-monospace, Consolas, monospace;
  font-family:var(--pv-body); color:var(--pv-fg); font-size:15px; line-height:1.45;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) #prevision{
  --pv-bg:#14181c; --pv-card:#1c2227; --pv-fg:#e4e8ec; --pv-muted:#9aa6b1; --pv-line:#2e363e;
  --pv-accent:#8fb8d6; --pv-accent-soft:#22313d; --pv-pos:#5cc492; --pv-neg:#f08378; --pv-warn:#e0b354; --pv-warn-soft:#3a3020; } }
:root[data-theme="dark"] #prevision{
  --pv-bg:#14181c; --pv-card:#1c2227; --pv-fg:#e4e8ec; --pv-muted:#9aa6b1; --pv-line:#2e363e;
  --pv-accent:#8fb8d6; --pv-accent-soft:#22313d; --pv-pos:#5cc492; --pv-neg:#f08378; --pv-warn:#e0b354; --pv-warn-soft:#3a3020; }
#prevision *{box-sizing:border-box}
#prevision h2,#prevision h3{font-family:var(--pv-head); margin:0; text-wrap:balance}
#prevision .pv-top{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px 24px; margin-bottom:16px}
#prevision .pv-top h2{font-size:1.6rem; font-weight:700; letter-spacing:-.01em}
#prevision .pv-fecha{color:var(--pv-muted); font-size:.9rem}
#prevision .pv-resumen{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:20px}
#prevision .pv-kpi{background:var(--pv-card); border:1px solid var(--pv-line); border-radius:8px; padding:14px 16px; display:flex; flex-direction:column; gap:4px}
#prevision .pv-kpi .lbl{font-size:.75rem; text-transform:uppercase; letter-spacing:.08em; color:var(--pv-muted); font-weight:600}
#prevision .pv-kpi .val{font-family:var(--pv-num); font-size:1.35rem; font-variant-numeric:tabular-nums; font-weight:600}
#prevision .pv-kpi .det{font-size:.82rem; color:var(--pv-muted)}
#prevision .pv-kpi.difer{background:var(--pv-accent-soft); border-color:transparent}
#prevision .pos{color:var(--pv-pos)} #prevision .neg{color:var(--pv-neg)}
#prevision .pv-cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr)); gap:20px; align-items:start}
#prevision .pv-col{display:flex; flex-direction:column; gap:16px; min-width:0}
#prevision .pv-col > h3{font-size:.85rem; text-transform:uppercase; letter-spacing:.12em; color:var(--pv-accent); border-bottom:2px solid var(--pv-accent); padding-bottom:4px}
#prevision details.pv-blk{background:var(--pv-card); border:1px solid var(--pv-line); border-radius:8px; min-width:0}
#prevision details.pv-blk > summary{cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:12px 16px; font-weight:600}
#prevision details.pv-blk > summary::-webkit-details-marker{display:none}
#prevision details.pv-blk > summary::before{content:"▸"; color:var(--pv-muted); margin-right:6px; transition:transform .15s}
#prevision details.pv-blk[open] > summary::before{transform:rotate(90deg); display:inline-block}
#prevision details.pv-blk > summary:focus-visible{outline:2px solid var(--pv-accent); outline-offset:2px}
#prevision summary .t{flex:1}
#prevision summary .n{font-weight:400; color:var(--pv-muted); font-size:.85rem; margin-left:6px}
#prevision summary .s{font-family:var(--pv-num); font-variant-numeric:tabular-nums}
#prevision .pv-tw{overflow-x:auto; border-top:1px solid var(--pv-line); max-height:460px; overflow-y:auto}
#prevision table{border-collapse:collapse; width:100%; font-size:.88rem}
#prevision th{position:sticky; top:0; background:var(--pv-card); text-align:left; font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--pv-muted); padding:8px 12px; border-bottom:1px solid var(--pv-line); white-space:nowrap}
#prevision td{padding:6px 12px; border-bottom:1px solid var(--pv-line); vertical-align:top}
#prevision tr:last-child td{border-bottom:0}
#prevision td.num, #prevision th.num{text-align:right; font-family:var(--pv-num); font-variant-numeric:tabular-nums; white-space:nowrap}
#prevision td.f{white-space:nowrap; color:var(--pv-muted); font-variant-numeric:tabular-nums}
#prevision td.nm{min-width:160px}
#prevision .chip{display:inline-block; font-size:.7rem; padding:1px 6px; border-radius:10px; background:var(--pv-accent-soft); color:var(--pv-accent); font-weight:600; margin-left:4px; white-space:nowrap}
#prevision .chip.venc{background:var(--pv-warn-soft); color:var(--pv-warn)}
#prevision .pv-mes{border-top:1px solid var(--pv-line)}
#prevision .pv-mes > summary{padding:8px 16px; cursor:pointer; display:flex; justify-content:space-between; gap:12px}
#prevision .pv-mes > summary:focus-visible{outline:2px solid var(--pv-accent)}
#prevision .pv-mes .pv-tw{max-height:none}
#prevision .pv-bancos td input{width:9.5em; font:inherit; font-family:var(--pv-num); text-align:right; padding:3px 6px; border:1px solid var(--pv-line); border-radius:4px; background:var(--pv-bg); color:var(--pv-fg)}
#prevision .pv-bancos td input:focus-visible{outline:2px solid var(--pv-accent)}
#prevision .pv-nota{font-size:.8rem; color:var(--pv-muted); padding:8px 16px 12px}
#prevision tfoot td{font-weight:700; border-top:2px solid var(--pv-line)}

[hidden]{display:none!important}
#prevision button.mini{padding:2px 8px;font-size:.75rem;font-weight:600}
#prevision .pv-nueva{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px 0}
#prevision .pv-nueva input{font:inherit;padding:4px 8px;border:1px solid var(--pv-line);border-radius:4px;background:var(--pv-bg);color:var(--pv-fg);min-width:0}
#prevision .pv-nueva input#pv-nueva-nombre{flex:1 1 160px}
#prevision .pv-nueva input#pv-nueva-imp{width:8em;text-align:right;font-family:var(--pv-num)}
@media print{#prevision .pv-nueva,#prevision button.mini{display:none!important}}
:root{--page-bg:#f6f7f8;--page-fg:#1d2329}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page-bg:#14181c;--page-fg:#e4e8ec;color-scheme:dark}}
:root[data-theme="dark"]{--page-bg:#14181c;--page-fg:#e4e8ec;color-scheme:dark}
body{margin:0;background:var(--page-bg);color:var(--page-fg)}
.wrap{max-width:1240px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
#prevision .pv-barra{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
#prevision .pv-barra label{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--pv-muted);font-weight:600}
#prevision input[type=date],#prevision input[type=password],#prevision input[type=url]{font:inherit;padding:6px 8px;border:1px solid var(--pv-line);border-radius:6px;background:var(--pv-card);color:var(--pv-fg)}
#prevision button{font:inherit;font-weight:600;padding:7px 14px;border-radius:6px;border:1px solid var(--pv-line);background:var(--pv-card);color:var(--pv-fg);cursor:pointer}
#prevision button.prim{background:var(--pv-accent);border-color:var(--pv-accent);color:var(--pv-card)}
#prevision button:disabled{opacity:.45;cursor:default}
#prevision button:focus-visible,#prevision input:focus-visible{outline:2px solid var(--pv-accent);outline-offset:2px}
#prevision .pv-login{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--pv-card);border:1px solid var(--pv-line);border-radius:8px;padding:16px;margin-bottom:16px}
#prevision .pv-error{color:var(--pv-neg);font-size:.9rem;min-height:1.2em;margin:0 0 12px}
#prevision .pv-aviso{background:var(--pv-warn-soft);color:var(--pv-fg);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:.9rem}
#prevision tr.prev td{font-style:italic}
#prevision td.vacio{color:var(--pv-muted);text-align:center;padding:14px}
#prevision .solo-print,#prevision .pv-imp-titulo{display:none}
@media print{
  #prevision #pv-recargar,#prevision #pv-salir{display:none!important}
  @page{size:A4;margin:12mm}
  :root{--page-bg:#fff;--page-fg:#000}
  #prevision{--pv-bg:#fff;--pv-card:#fff;--pv-fg:#000;--pv-muted:#444;--pv-line:#bbb;--pv-accent:#000;--pv-accent-soft:#eee;--pv-pos:#000;--pv-neg:#000;--pv-warn:#000;--pv-warn-soft:#eee;font-size:10.5pt}
  .wrap{padding:0;max-width:none}
  #prevision .pv-top,#prevision .pv-login,#prevision .pv-error,#prevision input{display:none!important}
  #prevision .solo-print,#prevision .pv-imp-titulo{display:inline}
  #prevision .pv-imp-titulo{display:block;font-weight:700;font-size:13pt;margin-bottom:8px}
  #prevision .pv-cols{display:block}
  #prevision .pv-col{display:block}
  #prevision .pv-col > h3{margin-top:14px}
  #prevision details.pv-blk{margin-top:8px;break-inside:auto}
  #prevision .pv-tw{max-height:none!important;overflow:visible!important}
  #prevision th{position:static}
  #prevision summary::before{display:none!important}
  #prevision .pv-resumen{grid-template-columns:repeat(3,1fr)}
  #prevision tr{break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap"><div id="prevision">
  <div class="pv-top">
    <h2>Previsión de tesorería</h2>
    <div class="pv-barra">
      <label for="pv-fecha">A fecha</label>
      <input type="date" id="pv-fecha">
      <button type="button" id="pv-hoy">Hoy</button>
      <button type="button" id="pv-btn-print" disabled>Imprimir</button>
      <button type="button" id="pv-btn-xlsx" class="prim" disabled>Descargar Excel</button>
      <button type="button" id="pv-recargar" hidden>Actualizar datos</button>
      <button type="button" id="pv-salir" hidden>Salir</button>
    </div>
  </div>
  <form class="pv-login" id="pv-login">
    <label for="pv-url">Dirección /exec de datt</label>
    <input type="url" id="pv-url" placeholder="https://script.google.com/macros/s/…/exec" required style="flex:1 1 320px;min-width:0">
    <label for="pv-clave">Clave</label>
    <input type="password" id="pv-clave" autocomplete="current-password" required>
    <button type="submit" class="prim">Entrar</button>
  </form>
  <p class="pv-error" id="pv-error" role="status"></p>
  <div id="pv-cuerpo"></div>
</div></div>
<script>
/* ===== PREVISIÓN DE TESORERÍA: cálculo a una fecha =====
   calcularPrevision(datt, fecha, extras)
   - datt: { invoicesOut, invoiceOutPayments, invoicesIn, invoiceInPayments, bankBalances, bankAccounts, clients, suppliers }
   - fecha: 'AAAA-MM-DD'. Si es hoy o anterior: cómo estaba ese día. Si es posterior: previsión.
   - extras: saldos que no están en datt, p. ej. [{clave:'vs', nombre:'VIZCAÍNO STONE', importe:2356.83}]
*/
(function(){
  const MESES=['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
  const r2=x=>Math.round(x*100)/100;
  const sum=a=>r2(a.reduce((s,x)=>s+x.importe,0));
  const hoyISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};

  // Fecha en que un efecto/pago se recibió o se entregó
  const fRecibido=p=>p.date||p.emissionDate||p.dueDate||'';
  // Fecha en que se cobró / pagó de verdad (si está marcado)
  const fCobro=p=>p.collected?(p.collectedDate||p.dueDate||p.date||''):'';
  const fPago =p=>p.paid?(p.paidDate||p.dueDate||p.date||''):'';

  window.calcularPrevision=function(t,fecha,extras){
    const hoy=hoyISO();
    fecha=fecha||hoy;
    const futuro=fecha>hoy;
    const corte=futuro?hoy:fecha;        // hasta aquí usamos lo que dice datt
    const cli={}; (t.clients||[]).forEach(c=>cli[c.id]=c.name);
    const pro={}; (t.suppliers||[]).forEach(s=>pro[s.id]=s.name);
    const fOut={}; (t.invoicesOut||[]).forEach(f=>fOut[f.id]=f);
    const fIn={};  (t.invoicesIn||[]).forEach(f=>fIn[f.id]=f);
    const porFactura=(lista)=>{const m={}; (lista||[]).forEach(p=>(m[p.invoiceId]=m[p.invoiceId]||[]).push(p)); return m;};
    const pagOut=porFactura(t.invoiceOutPayments), pagIn=porFactura(t.invoiceInPayments);

    /* ---- VENTAS ---- */
    const ventas=[], cartera=[];
    (t.invoicesOut||[]).forEach(f=>{
      if(!f.date||f.date>corte) return;                         // aún no emitida
      const pagos=(pagOut[f.id]||[]).filter(p=>fRecibido(p)<=corte);
      const cobrada=f.collected && (f.collectedDate||'')<=corte;   // marcada cobrada en esa fecha: no queda resto
      if(!pagos.length && cobrada) return;
      const resto=cobrada?0:r2(f.amount-pagos.reduce((s,p)=>s+(+p.amount||0),0));
      if(resto>0.005) ventas.push({numero:f.number,fecha:f.date,vence:f.dueDate||'',nombre:cli[f.clientId]||'—',importe:resto});
      pagos.forEach(p=>{
        const c=fCobro(p);
        if(c && c<=corte) return;                               // ya cobrado en esa fecha
        cartera.push({numero:f.number,nombre:cli[f.clientId]||'—',vence:p.dueDate||'',tipo:p.method||'',remesado:!!(p.remesado||p.negotiated),importe:r2(+p.amount||0)});
      });
    });

    /* ---- COMPRAS ---- */
    const compras=[], efectos=[];
    (t.invoicesIn||[]).forEach(f=>{
      if(!f.date||f.date>corte) return;
      const pagos=(pagIn[f.id]||[]).filter(p=>fRecibido(p)<=corte);
      const pagada=f.paid && (f.paidDate||'')<=corte;
      if(!pagos.length && pagada) return;
      const resto=pagada?0:r2(f.amount-pagos.reduce((s,p)=>s+(+p.amount||0),0));
      if(resto>0.005) compras.push({numero:f.number,fecha:f.date,vence:f.dueDate||'',nombre:pro[f.supplierId]||'—',importe:resto});
      pagos.forEach(p=>{
        const c=fPago(p);
        if(c && c<=corte) return;
        efectos.push({numero:f.number,nombre:pro[f.supplierId]||'—',vence:p.dueDate||'',tipo:p.method||'',importe:r2(+p.amount||0)});
      });
    });

    /* ---- BANCOS: último saldo con fecha hasta el corte ---- */
    const ult={};
    (t.bankBalances||[]).forEach(b=>{ if(b.date>corte) return; const o=ult[b.bankId]; if(!o||b.date>=o.date) ult[b.bankId]=b; });
    const bancos=(t.bankAccounts||[]).filter(a=>!a.archived&&!a.type)        // fuera confirmings y líneas de descuento
      .map(a=>({nombre:a.name,fecha:ult[a.id]?.date||'',importe:r2(ult[a.id]?.amount||0),sinSaldo:!ult[a.id]}));
    if(ult.cash && ult.cash.amount) bancos.push({nombre:'CAJA',fecha:ult.cash.date,importe:r2(ult.cash.amount)});
    (extras||[]).forEach(e=>bancos.push({nombre:e.nombre,fecha:'',importe:r2(+e.importe||0),manual:true,clave:e.clave}));

    /* ---- FUTURO: lo que vence hasta la fecha pasa por el banco ---- */
    let cobradoPrevisto=[], pagadoPrevisto=[];
    if(futuro){
      cobradoPrevisto=cartera.filter(x=>x.vence&&x.vence<=fecha);
      pagadoPrevisto=efectos.filter(x=>x.vence&&x.vence<=fecha);
      const sigue=(lista,quita)=>lista.filter(x=>!quita.includes(x));
      cartera.splice(0,cartera.length,...sigue(cartera,cobradoPrevisto));
      efectos.splice(0,efectos.length,...sigue(efectos,pagadoPrevisto));
      const mov=r2(sum(cobradoPrevisto)-sum(pagadoPrevisto));
      if(cobradoPrevisto.length||pagadoPrevisto.length)
        bancos.push({nombre:'Movimiento previsto hasta la fecha',fecha:'',importe:mov,previsto:true});
    }

    const meses={};
    efectos.forEach(e=>{const k=e.vence?e.vence.slice(0,7):'sin';(meses[k]=meses[k]||[]).push(e)});
    const pagaresMes=Object.keys(meses).sort((a,b)=>a==='sin'?1:b==='sin'?-1:a.localeCompare(b)).map(k=>({
      clave:k,nombre:k==='sin'?'SIN FECHA':MESES[+k.slice(5,7)-1]+' '+k.slice(0,4),
      lineas:meses[k].sort((a,b)=>a.vence.localeCompare(b.vence)),importe:sum(meses[k])}));
    ventas.sort((a,b)=>b.fecha.localeCompare(a.fecha)); compras.sort((a,b)=>b.fecha.localeCompare(a.fecha));
    cartera.sort((a,b)=>(a.vence||'9').localeCompare(b.vence||'9'));

    const tVentas=sum(ventas),tCartera=sum(cartera),tBancos=sum(bancos),tCompras=sum(compras),tPagares=sum(pagaresMes);
    const totalVentas=r2(tVentas+tCartera+tBancos), totalCompras=r2(tCompras+tPagares);
    const primerSaldo=(t.bankBalances||[]).map(b=>b.date).sort()[0]||'';
    return {hoy,fecha,futuro,primerSaldo,ventas,cartera,compras,pagaresMes,bancos,cobradoPrevisto,pagadoPrevisto,
      tVentas,tCartera,tBancos,tCompras,tPagares,totalVentas,totalCompras,diferencia:r2(totalVentas-totalCompras)};
  };
})();

</script>
<script>
/* ===== Generador de Excel (.xlsx) sin librerías =====
   crearExcel([{nombre:'Hoja', filas:[[...],[...]], anchos:[..], negritas:[índices de fila]}]) -> Blob
   Números con formato "#.##0,00 €"; textos como texto. */
(function(){
  const enc=new TextEncoder();
  const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
  const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
  function zip(archivos){ // método "store": sin comprimir, válido para Excel
    const partes=[],central=[];let off=0;
    const u16=v=>[v&255,(v>>8)&255], u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
    archivos.forEach(([nombre,texto])=>{
      const n=enc.encode(nombre),d=enc.encode(texto),c=crc32(d);
      const cab=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(d.length),...u32(d.length),...u16(n.length),...u16(0)]);
      partes.push(cab,n,d);
      central.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(d.length),...u32(d.length),...u16(n.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),n);
      off+=cab.length+n.length+d.length;
    });
    const tam=central.reduce((s,a)=>s+a.length,0);
    const fin=new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(archivos.length),...u16(archivos.length),...u32(tam),...u32(off),0,0]);
    return new Blob([...partes,...central,fin],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  }
  const x=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const col=i=>{let s='';i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=(i-m-1)/26}return s};
  function hojaXml(h){
    const neg=new Set(h.negritas||[]);
    const filas=h.filas.map((f,r)=>`<row r="${r+1}">${f.map((v,c)=>{
      if(v===''||v==null) return '';
      const ref=col(c)+(r+1), b=neg.has(r);
      return typeof v==='number'?`<c r="${ref}" s="${b?3:1}"><v>${v}</v></c>`:`<c r="${ref}" t="inlineStr"${b?' s="2"':''}><is><t xml:space="preserve">${x(v)}</t></is></c>`;
    }).join('')}</row>`).join('');
    const cols=(h.anchos||[]).map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('');
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${cols?`<cols>${cols}</cols>`:''}<sheetData>${filas}</sheetData></worksheet>`;
  }
  window.crearExcel=function(hojas){
    const NS='http://schemas.openxmlformats.org/';
    const a=[
      ['[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="${NS}package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${hojas.map((h,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`],
      ['_rels/.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}package/2006/relationships"><Relationship Id="rId1" Type="${NS}officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
      ['xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${NS}spreadsheetml/2006/main" xmlns:r="${NS}officeDocument/2006/relationships"><sheets>${hojas.map((h,i)=>`<sheet name="${x(h.nombre.slice(0,31))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`],
      ['xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}package/2006/relationships">${hojas.map((h,i)=>`<Relationship Id="rId${i+1}" Type="${NS}officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${hojas.length+1}" Type="${NS}officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
      ['xl/styles.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${NS}spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0.00\\ &quot;€&quot;"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="164" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`],
      ...hojas.map((h,i)=>[`xl/worksheets/sheet${i+1}.xml`,hojaXml(h)])
    ];
    return zip(a);
  };
  window.descargarBlob=function(blob,nombre){
    const u=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=u;a.download=nombre;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
  };
})();

</script>
<script>
/* ===== PREVISIÓN DE TESORERÍA: conexión, pantalla, imprimir y Excel ===== */
(function(){
  /* ---------- 1. CONEXIÓN CON DATT (misma dirección /exec y clave que tesorería) ---------- */
  // Igual que el panel: POST con texto JSON {action:'getAll', key} a la dirección /exec.
  // Devuelve {ok, data:{coleccion:[{id, json}]}}. La dirección y la clave las escribe cada usuaria
  // y se guardan solo en su navegador; no van dentro de este archivo.
  const TABLAS=['invoicesOut','invoiceOutPayments','invoicesIn','invoiceInPayments','bankBalances','bankAccounts','clients','suppliers'];
  async function cargarDatt(url,clave){
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'getAll',key:clave})});
    if(!r.ok) throw new Error('el servicio respondió '+r.status);
    const j=await r.json();
    if(j.error) throw new Error(j.error);
    if(!j.ok||!j.data) throw new Error('respuesta inesperada');
    const t={};
    TABLAS.forEach(c=>{t[c]=(j.data[c]||[]).map(f=>{try{const o=JSON.parse(f.json);o.id=o.id||f.id;return o}catch(e){return null}}).filter(Boolean)});
    return t;
  }

  /* ---------- utilidades ---------- */
  const $=s=>document.querySelector(s);
  const num=x=>{const [e,d]=Math.abs(x).toFixed(2).split('.');return (x<0?'−':'')+e.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+d};
  const eur=x=>num(x)+' €';
  const fd=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const leer=(k,def)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??def}catch(e){return def}};
  const guardar=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

  let DATOS=null, ULTIMO=null;
  let extras=leer('prevision.extras',[{clave:'vs',nombre:'VIZCAÍNO STONE',importe:2356.83}]);
  let ajustes=leer('prevision.ajustes',{});
  const abiertos=new Set(leer('prevision.abiertos',['bancos','pagares']));

  /* ---------- 2. PANTALLA ---------- */
  const tabla=(cab,filas,total)=>`<div class="pv-tw"><table><thead><tr>${cab.map(c=>`<th${c.n?' class="num"':''}>${c.t}</th>`).join('')}</tr></thead><tbody>${filas.join('')||`<tr><td colspan="${cab.length}" class="vacio">Nada pendiente a esta fecha</td></tr>`}</tbody>${total!=null?`<tfoot><tr><td colspan="${cab.length-1}">Total</td><td class="num">${eur(total)}</td></tr></tfoot>`:''}</table></div>`;
  const venc=(v,ref)=>v&&v<ref?' <span class="chip venc">vencido</span>':'';
  const blk=(k,titulo,n,total,cuerpo)=>`<details class="pv-blk" data-k="${k}"${abiertos.has(k)?' open':''}><summary><span class="t">${titulo}<span class="n">${n}</span></span><span class="s">${eur(total)}</span></summary>${cuerpo}</details>`;

  function pintar(){
    if(!DATOS) return;
    const fecha=$('#pv-fecha').value;
    const p=ULTIMO=calcularPrevision(DATOS,fecha,extras);
    // Saldos puestos a mano para esta fecha: sustituyen al de datt
    p.bancos.forEach(b=>{ if(b.manual||b.previsto) return; const k=p.fecha+'|'+b.nombre;
      b.datt=b.importe; if(k in ajustes){b.importe=ajustes[k];b.ajustado=true;b.sinSaldo=false;} b.k=k; });
    const r2=x=>Math.round(x*100)/100;
    p.tBancos=r2(p.bancos.reduce((s,b)=>s+b.importe,0)); p.totalVentas=r2(p.tVentas+p.tCartera+p.tBancos); p.diferencia=r2(p.totalVentas-p.totalCompras);
    const ref=p.fecha;
    const ventas=tabla([{t:'Nº factura'},{t:'Cliente'},{t:'Fecha'},{t:'Importe',n:1}],
      p.ventas.map(v=>`<tr><td>${esc(v.numero)}</td><td class="nm">${esc(v.nombre)}</td><td class="f">${fd(v.fecha)}</td><td class="num">${eur(v.importe)}</td></tr>`),p.tVentas);
    const cartera=tabla([{t:'Vence'},{t:'Cliente'},{t:'Factura'},{t:'Importe',n:1}],
      p.cartera.map(v=>`<tr><td class="f">${fd(v.vence)||'—'}</td><td class="nm">${esc(v.nombre)} <span class="chip">${esc(v.tipo)}</span>${v.remesado?'<span class="chip">remesado</span>':''}${venc(v.vence,ref)}</td><td>${esc(v.numero)}</td><td class="num">${eur(v.importe)}</td></tr>`),p.tCartera);
    const celda=b=>b.previsto?eur(b.importe):`<input id="pv-b-${esc(b.manual?b.clave:b.k).replace(/[^a-zA-Z0-9]/g,'_')}" ${b.manual?`data-clave="${esc(b.clave)}"`:`data-k="${esc(b.k)}"`} inputmode="decimal" value="${num(b.importe)}" aria-label="Saldo ${esc(b.nombre)}"><span class="solo-print">${eur(b.importe)}</span>`;
    const etiqueta=b=>b.manual?` <span class="chip">a mano</span>${b.clave!=='vs'?` <button type="button" class="mini" data-quitar="${esc(b.clave)}" aria-label="Quitar ${esc(b.nombre)}">Quitar</button>`:''}`
      :b.ajustado?` <span class="chip">a mano · datt ${num(b.datt)}</span> <button type="button" class="mini" data-volver="${esc(b.k)}">Volver a datt</button>`
      :b.sinSaldo?' <span class="chip venc">sin saldo a esta fecha</span>':'';
    const bancos=`<div class="pv-tw pv-bancos"><table><thead><tr><th>Cuenta</th><th>Saldo a</th><th class="num">Importe</th></tr></thead><tbody>${p.bancos.map(b=>`<tr${b.previsto?' class="prev"':''}><td>${esc(b.nombre)}${etiqueta(b)}${b.previsto?` <span class="chip">+${num(p.cobradoPrevisto.reduce((s,x)=>s+x.importe,0))} cobros · −${num(p.pagadoPrevisto.reduce((s,x)=>s+x.importe,0))} pagos</span>`:''}</td><td class="f">${b.manual||b.previsto||b.ajustado?'—':fd(b.fecha)}</td><td class="num">${celda(b)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="2">Total</td><td class="num">${eur(p.tBancos)}</td></tr></tfoot></table></div>
      <form class="pv-nueva" id="pv-nueva"><input id="pv-nueva-nombre" placeholder="Otra cuenta (nombre)" required aria-label="Nombre de la cuenta"><input id="pv-nueva-imp" inputmode="decimal" placeholder="0,00" required aria-label="Importe"><button type="submit" class="mini">Añadir</button></form>
      <div class="pv-nota">Puedes cambiar cualquier saldo: escribe el importe y pulsa Intro. Un saldo de datt cambiado a mano vale solo para la fecha elegida.</div>`;
    const compras=tabla([{t:'Nº factura'},{t:'Proveedor'},{t:'Fecha'},{t:'Importe',n:1}],
      p.compras.map(v=>`<tr><td>${esc(v.numero)}</td><td class="nm">${esc(v.nombre)}</td><td class="f">${fd(v.fecha)}</td><td class="num">${eur(v.importe)}</td></tr>`),p.tCompras);
    const pagares=p.pagaresMes.length?p.pagaresMes.map(m=>`<details class="pv-mes" data-k="m-${m.clave}"${abiertos.has('m-'+m.clave)?' open':''}><summary><span>${m.nombre} <span class="chip">${m.lineas.length}</span></span><span class="s">${eur(m.importe)}</span></summary>${tabla([{t:'Vence'},{t:'Proveedor'},{t:'Factura'},{t:'Importe',n:1}],m.lineas.map(v=>`<tr><td class="f">${fd(v.vence)||'—'}</td><td class="nm">${esc(v.nombre)} <span class="chip">${esc(v.tipo)}</span>${venc(v.vence,ref)}</td><td>${esc(v.numero)}</td><td class="num">${eur(v.importe)}</td></tr>`))}</details>`).join(''):'<div class="pv-nota">No hay pagarés pendientes a esta fecha.</div>';

    let aviso='';
    if(p.futuro) aviso=`<div class="pv-aviso">Previsión a una fecha futura. Los pagarés que vencen hasta el ${fd(p.fecha)} se dan por cobrados o pagados y pasan al banco. Las facturas sin pagaré se quedan como están.</div>`;
    else if(p.primerSaldo && p.fecha<p.primerSaldo) aviso=`<div class="pv-aviso">datt no tiene saldos de bancos anteriores al ${fd(p.primerSaldo)}. Los bancos salen a cero.</div>`;

    $('#pv-cuerpo').innerHTML=`
      <div class="pv-imp-titulo">Hermanos Vizcaíno, S.C.A. · Previsión de tesorería a ${fd(p.fecha)}${p.futuro?' (previsión)':''}</div>
      ${aviso}
      <div class="pv-resumen">
        <div class="pv-kpi"><span class="lbl">Total ventas</span><span class="val">${eur(p.totalVentas)}</span><span class="det">Facturas ${eur(p.tVentas)} · Pagarés ${eur(p.tCartera)} · Bancos ${eur(p.tBancos)}</span></div>
        <div class="pv-kpi"><span class="lbl">Total compras</span><span class="val">${eur(p.totalCompras)}</span><span class="det">Facturas ${eur(p.tCompras)} · Pagarés ${eur(p.tPagares)}</span></div>
        <div class="pv-kpi difer"><span class="lbl">Diferencia</span><span class="val ${p.diferencia>=0?'pos':'neg'}">${eur(p.diferencia)}</span><span class="det">Total ventas − total compras</span></div>
      </div>
      <div class="pv-cols">
        <section class="pv-col"><h3>Ventas</h3>
          ${blk('ventas','Facturas pendientes de cobro',p.ventas.length,p.tVentas,ventas)}
          ${blk('cartera','Pagarés recibidos',p.cartera.length,p.tCartera,cartera)}
          ${blk('bancos','Bancos',p.bancos.length,p.tBancos,bancos)}
        </section>
        <section class="pv-col"><h3>Compras</h3>
          ${blk('compras','Facturas de proveedor pendientes',p.compras.length,p.tCompras,compras)}
          ${blk('pagares','Pagarés a pagar por mes',p.pagaresMes.reduce((s,m)=>s+m.lineas.length,0),p.tPagares,pagares)}
        </section>
      </div>`;
    $('#pv-cuerpo').querySelectorAll('details[data-k]').forEach(d=>d.addEventListener('toggle',()=>{d.open?abiertos.add(d.dataset.k):abiertos.delete(d.dataset.k);guardar('prevision.abiertos',[...abiertos])}));
    const leerImp=t=>parseFloat(String(t).trim().replace(/−/g,'-').replace(/\s|€/g,'').replace(/\./g,'').replace(',','.'));
    $('#pv-cuerpo').querySelectorAll('.pv-bancos input').forEach(inp=>inp.addEventListener('change',()=>{
      const v=leerImp(inp.value); if(isNaN(v)){inp.value='';return;}
      if(inp.dataset.k){ajustes[inp.dataset.k]=v;guardar('prevision.ajustes',ajustes);}
      else{const x=extras.find(e=>e.clave===inp.dataset.clave); if(x){x.importe=v;guardar('prevision.extras',extras);}}
      const id=inp.id; pintar(); document.getElementById(id)?.focus();
    }));
    $('#pv-cuerpo').querySelectorAll('[data-volver]').forEach(b=>b.addEventListener('click',()=>{delete ajustes[b.dataset.volver];guardar('prevision.ajustes',ajustes);pintar();}));
    $('#pv-cuerpo').querySelectorAll('[data-quitar]').forEach(b=>b.addEventListener('click',()=>{extras=extras.filter(e=>e.clave!==b.dataset.quitar);guardar('prevision.extras',extras);pintar();}));
    $('#pv-nueva')?.addEventListener('submit',e=>{e.preventDefault();const n=$('#pv-nueva-nombre').value.trim(),v=leerImp($('#pv-nueva-imp').value);
      if(!n||isNaN(v))return; extras.push({clave:'c'+Date.now(),nombre:n.toUpperCase(),importe:v});guardar('prevision.extras',extras);pintar();});
    $('#pv-btn-print').disabled=$('#pv-btn-xlsx').disabled=false;
  }

  /* ---------- 3. IMPRIMIR: abre todos los bloques mientras se imprime ---------- */
  let cerrados=[];
  window.addEventListener('beforeprint',()=>{cerrados=[...document.querySelectorAll('#pv-cuerpo details:not([open])')];cerrados.forEach(d=>d.open=true)});
  window.addEventListener('afterprint',()=>{cerrados.forEach(d=>d.open=false);cerrados=[]});

  /* ---------- 4. EXCEL: una pestaña por bloque, importes como números ---------- */
  function descargarExcel(){
    const p=ULTIMO; if(!p) return;
    const F=s=>s?fd(s):'';
    const tabla=(cab,filas,tot,anchos)=>({filas:[cab,...filas,[...Array(cab.length-2).fill(''),'TOTAL',tot]],anchos,negritas:[0,filas.length+1]});
    const res=[['Hermanos Vizcaíno, S.C.A.'],['Previsión de tesorería a '+fd(p.fecha)+(p.futuro?' (previsión)':'')],[],
      ['VENTAS','Importe'],['Facturas pendientes de cobro',p.tVentas],['Pagarés recibidos',p.tCartera],['Bancos',p.tBancos],['TOTAL VENTAS',p.totalVentas],[],
      ['COMPRAS','Importe'],['Facturas de proveedor pendientes',p.tCompras],['Pagarés a pagar',p.tPagares],['TOTAL COMPRAS',p.totalCompras],[],
      ['DIFERENCIA',p.diferencia],[],['PAGARÉS A PAGAR POR MES','Importe'],...p.pagaresMes.map(m=>[m.nombre,m.importe])];
    const hojas=[
      {nombre:'Resumen',filas:res,anchos:[36,16],negritas:[0,1,3,7,9,12,14,16]},
      {nombre:'Ventas',...tabla(['Nº factura','Cliente','Fecha','Importe'],p.ventas.map(v=>[v.numero,v.nombre,F(v.fecha),v.importe]),p.tVentas,[14,42,12,16])},
      {nombre:'Pagarés recibidos',...tabla(['Vence','Cliente','Factura','Tipo','Remesado','Importe'],p.cartera.map(v=>[F(v.vence),v.nombre,v.numero,v.tipo,v.remesado?'Sí':'',v.importe]),p.tCartera,[12,42,12,12,10,16])},
      {nombre:'Bancos',...tabla(['Cuenta','Saldo a','Importe'],p.bancos.map(b=>[b.nombre,F(b.fecha),b.importe]),p.tBancos,[38,12,16])},
      {nombre:'Compras',...tabla(['Nº factura','Proveedor','Fecha','Importe'],p.compras.map(v=>[v.numero,v.nombre,F(v.fecha),v.importe]),p.tCompras,[16,42,12,16])},
      {nombre:'Pagarés a pagar',...tabla(['Mes','Vence','Proveedor','Factura','Tipo','Importe'],p.pagaresMes.flatMap(m=>m.lineas.map(v=>[m.nombre,F(v.vence),v.nombre,v.numero,v.tipo,v.importe])),p.tPagares,[16,12,42,14,12,16])}
    ];
    descargarBlob(crearExcel(hojas),'prevision_tesoreria_'+p.fecha+'.xlsx');
  }

  /* ---------- 5. ARRANQUE ---------- */
  window.iniciarPrevision=function(datosDePrueba){
    const hoy=(()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)})();
    $('#pv-fecha').value=hoy;
    $('#pv-fecha').addEventListener('change',pintar);
    $('#pv-hoy').addEventListener('click',()=>{$('#pv-fecha').value=hoy;pintar()});
    $('#pv-btn-print').addEventListener('click',()=>window.print());
    $('#pv-btn-xlsx').addEventListener('click',descargarExcel);
    if(datosDePrueba){DATOS=datosDePrueba;$('#pv-login').hidden=true;pintar();return;}
    const con=leer('prevision.conexion',null);
    if(con){$('#pv-url').value=con.url||'';$('#pv-clave').value=con.clave||'';}
    async function entrar(){
      const url=$('#pv-url').value.trim(), clave=$('#pv-clave').value;
      $('#pv-error').textContent='Cargando datos de datt…';
      try{ DATOS=await cargarDatt(url,clave); guardar('prevision.conexion',{url,clave});
        $('#pv-login').hidden=true; $('#pv-salir').hidden=false; $('#pv-recargar').hidden=false; $('#pv-error').textContent=''; pintar(); }
      catch(err){ $('#pv-login').hidden=false; $('#pv-error').textContent='No se han podido leer los datos de datt: '+err.message+'. Revisa la dirección y la clave.'; }
    }
    $('#pv-login').addEventListener('submit',e=>{e.preventDefault();entrar();});
    $('#pv-recargar').addEventListener('click',entrar);
    $('#pv-salir').addEventListener('click',()=>{try{localStorage.removeItem('prevision.conexion')}catch(_){}
      DATOS=null;$('#pv-cuerpo').innerHTML='';$('#pv-url').value='';$('#pv-clave').value='';$('#pv-login').hidden=false;$('#pv-salir').hidden=true;$('#pv-recargar').hidden=true;
      $('#pv-btn-print').disabled=$('#pv-btn-xlsx').disabled=true;});
    if(con&&con.url&&con.clave) entrar();
  };
})();

</script>
<script>iniciarPrevision();</script>
</body>
</html>
